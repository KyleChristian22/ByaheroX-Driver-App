workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    working_directory: driver
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Disable SwiftPM
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Build iOS App
        script: |
          flutter build ios --debug --no-codesign
    artifacts:
      - driver/build/ios/iphoneos/*.app
      - driver/build/ios/ipa/*.ipa